<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت سفارش‌ها | LaLa Marnia</title>
    <link rel="stylesheet" href="/styles.css?v=lala-marnia-1">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="LaLa Marnia، صفحه اصلی"><span>LaLa</span> Marnia</a>
        <nav class="site-nav">
            <a href="/">محصولات</a>
            <a href="/cart.html">سبد خرید</a>
            <a href="/admin.html" aria-current="page">مدیریت سفارش‌ها</a>
        </nav>
    </header>

    <main class="page admin-page">
        <section class="intro">
            <span class="eyebrow">پنل فروشگاه</span>
            <h1>مدیریت سفارش‌ها</h1>
            <p>سفارش‌های ثبت‌شده و جزئیات هر خرید را اینجا ببینید.</p>
        </section>
        <section class="order-filter panel" aria-label="فیلتر سفارش‌ها">
            <label for="status-filter">نمایش سفارش‌ها</label>
            <select id="status-filter" class="status-filter">
                <option value="all">همه سفارش‌ها</option>
                <option value="pending">در انتظار بررسی</option>
                <option value="processing">در حال پردازش</option>
                <option value="shipped">ارسال شده</option>
                <option value="completed">تکمیل شده</option>
                <option value="cancelled">لغو شده</option>
            </select>
        </section>
        <div id="orders" class="orders-list" aria-live="polite"></div>
    </main>

    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="status-icon-pending" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"></circle>
            <path d="M12 7v5l3.5 2"></path>
        </symbol>
        <symbol id="status-icon-processing" viewBox="0 0 24 24">
            <path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M18 6l-1.4 1.4M7.4 16.6 6 18M18 18l-1.4-1.4M7.4 7.4 6 6"></path>
            <circle cx="12" cy="12" r="4"></circle>
        </symbol>
        <symbol id="status-icon-shipped" viewBox="0 0 24 24">
            <path d="M3 6.5h11v10H3zM14 10h3.2l3 3v3.5H14z"></path>
            <circle cx="7" cy="18" r="1.5"></circle>
            <circle cx="17.5" cy="18" r="1.5"></circle>
        </symbol>
        <symbol id="status-icon-completed" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"></circle>
            <path d="m8 12 2.7 2.7L16.5 9"></path>
        </symbol>
        <symbol id="status-icon-cancelled" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"></circle>
            <path d="m9 9 6 6m0-6-6 6"></path>
        </symbol>
    </svg>

    <script>
        const statusLabels = {
            pending: "در انتظار بررسی",
            processing: "در حال پردازش",
            shipped: "ارسال شده",
            completed: "تکمیل شده",
            cancelled: "لغو شده"
        };

        let orders = [];

        async function loadOrders() {
            const response = await fetch("/api/orders");

            if (!response.ok) {
                document.getElementById("orders").textContent =
                    "خطا در دریافت سفارش‌ها";
                return;
            }

            orders = await response.json();
            renderOrders();
        }

        function renderOrders() {
            const container = document.getElementById("orders");
            const selectedStatus = document.getElementById("status-filter").value;
            container.replaceChildren();
            container.classList.remove("empty-state");

            if (orders.length === 0) {
                container.textContent = "هنوز سفارشی ثبت نشده است.";
                return;
            }

            const visibleOrders = selectedStatus === "all"
                ? orders
                : orders.filter((order) => order.Status === selectedStatus);

            if (visibleOrders.length === 0) {
                container.textContent = "سفارشی با این وضعیت وجود ندارد.";
                container.classList.add("empty-state");
                return;
            }

            container.classList.remove("empty-state");

            for (const order of visibleOrders) {
                const orderElement = document.createElement("article");

                orderElement.className = "order-card";

                orderElement.innerHTML = `
                    <h2>سفارش #${order.ID}</h2>

                    <div class="order-meta">
                        <div class="order-date">
                            <span class="order-date-icon" aria-hidden="true">▦</span>
                            <div>
                                <span class="order-meta-label">تاریخ سفارش</span>
                                <time datetime="${order.CreatedAt}">
                                    ${new Date(order.CreatedAt).toLocaleDateString("fa-IR")}
                                </time>
                            </div>
                        </div>

                        <div class="order-status-field" data-status="${order.Status}">
                            <label for="order-status-${order.ID}">وضعیت سفارش</label>
                            <div class="order-status-control">
                                <svg class="status-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <use href="#status-icon-${order.Status}"></use>
                                </svg>
                                <select
                                    id="order-status-${order.ID}"
                                    class="order-status"
                                    data-order-id="${order.ID}"
                                    data-current-status="${order.Status}"
                                >
                                    <option value="pending" ${order.Status === "pending" ? "selected" : ""}>${statusLabels.pending}</option>
                                    <option value="processing" ${order.Status === "processing" ? "selected" : ""}>${statusLabels.processing}</option>
                                    <option value="shipped" ${order.Status === "shipped" ? "selected" : ""}>${statusLabels.shipped}</option>
                                    <option value="completed" ${order.Status === "completed" ? "selected" : ""}>${statusLabels.completed}</option>
                                    <option value="cancelled" ${order.Status === "cancelled" ? "selected" : ""}>${statusLabels.cancelled}</option>
                                </select>
                            </div>
                        </div>
                    </div>


                    <p>
                        <strong>نام:</strong>
                        ${order.CustomerName}
                    </p>

                    <p>
                        <strong>تلفن:</strong>
                        ${order.CustomerPhone}
                    </p>

                    <p>
                        <strong>آدرس:</strong>
                        ${order.CustomerAddress}
                    </p>

                    <h3>محصولات</h3>

                    <div class="order-items"></div>

                    <p>
                        <strong>مبلغ کل:</strong>
                        ${order.TotalPrice.toLocaleString()} تومان
                    </p>
                `;

                const itemsContainer =
                    orderElement.querySelector(".order-items");

                for (const item of order.Items) {
                    const itemElement = document.createElement("div");

                    itemElement.className = "order-item";

                    const subtotal = item.UnitPrice * item.Quantity;

                    itemElement.innerHTML = `
                        <img
                            src="${item.Product.image_url}"
                            alt="${item.Product.name}"
                        >

                        <div>
                            <strong>${item.Product.name}</strong>

                            <p>
                                تعداد: ${item.Quantity}
                            </p>

                            <p>
                                قیمت واحد: ${item.UnitPrice.toLocaleString()} تومان
                            </p>

                            <p>
                                جمع: ${subtotal.toLocaleString()} تومان
                            </p>
                        </div>
                    `;

                    itemsContainer.appendChild(itemElement);
                }

                container.appendChild(orderElement);
            }
        }

        function showNotification(message, type) {
            document.querySelectorAll(".notification").forEach((item) => item.remove());

            const notification = document.createElement("div");
            notification.className = `notification notification-${type}`;
            notification.textContent = message;
            notification.setAttribute("role", type === "error" ? "alert" : "status");

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }


        document.addEventListener("change", async (event) => {
            if (!event.target.classList.contains("order-status")) {
                return;
            }

            const select = event.target;

            const orderID = select.dataset.orderId;
            const previousStatus = select.dataset.currentStatus;
            const newStatus = select.value;

            let response;
            select.disabled = true;
            try {
                response = await fetch(`/api/orders/${orderID}/status`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                if (!response.ok) {
                    select.value = previousStatus;
                    showNotification(
                        "تغییر وضعیت سفارش ناموفق بود",
                        "error"
                    );

                    return;
                }

            } catch (error) {
                select.value = previousStatus;
                showNotification("ارتباط با سرور برقرار نشد", "error");
                console.error("Status update error:", error)
                return;

            } finally {
                select.disabled = false;
            }

            select.dataset.currentStatus = newStatus;
            const updatedOrder = orders.find((order) => String(order.ID) === orderID);
            if (updatedOrder) {
                updatedOrder.Status = newStatus;
            }
            showNotification(
                "وضعیت سفارش با موفقیت تغییر کرد",
                "success"
            );
            renderOrders();
        });

        document.getElementById("status-filter").addEventListener("change", renderOrders);
        document.addEventListener("DOMContentLoaded", loadOrders);
    </script>
</body>
</html>
