<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css?v=lala-marnia-2">
    <title>محصول | LaLa Marnia</title>
</head>

<body>

    <header class="site-header">
        <a class="brand" href="/" aria-label="LaLa Marnia، صفحه اصلی"><span>LaLa</span> Marnia</a>
        <nav class="site-nav" aria-label="ناوبری اصلی"><a href="/">فروشگاه</a><a href="/cart.html">سبد خرید</a></nav>
    </header>
    <main class="page">
        <p class="breadcrumb"><a class="muted" href="/">فروشگاه</a><span aria-hidden="true">/</span><span>جزئیات محصول</span></p>
        <div id="product" class="panel product-detail"></div>
    </main>
    <footer class="site-footer"><a class="brand" href="/">LaLa Marnia</a><span>زیبایی، در لحظه‌های روزمره.</span></footer>

    <script>
        async function loadProduct() {

            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            const response = await fetch(`/api/products/${id}`);
            const product = await response.json();

            const container = document.getElementById("product");
            container.innerHTML = `
                <div class="product-detail-image"><img src="${product.image_url}" alt="${product.name}"></div>
                <section>
                    <span class="eyebrow">LaLa Marnia · انتخابی برای مراقبت تو</span>
                    <h1>${product.name}</h1>
                    <p class="product-description">${product.description}</p>
                    <p class="price product-detail-price">${product.price.toLocaleString()} <span>تومان</span></p>
                    <button class="add-to-cart" onclick="addToCart(${product.ID})">افزودن به سبد خرید <span aria-hidden="true">←</span></button>
                    <p class="product-assurance"><span aria-hidden="true">✓</span> سفارش آسان و خرید مطمئن</p>
                </section>
            `;
        }

        loadProduct();

        function showNotification(message, type) {
            document.querySelectorAll(".notification").forEach((item) => item.remove());

            const notification = document.createElement("div");
            notification.className = `notification notification-${type}`;
            notification.textContent = message;
            notification.setAttribute("role", type === "error" ? "alert" : "status");
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 3000);
        }

        function addToCart(id) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            const existingItem = cart.find(item => item.id === id); 

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    id: id,
                    quantity: 1
                });
            }

            localStorage.setItem("cart", JSON.stringify(cart));
            showNotification("محصول به سبد خرید اضافه شد.", "success");
        }
    </script>

</body>
</html>
