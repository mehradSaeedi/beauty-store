<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css?v=lala-marnia-2">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="LaLa Marnia، صفحه اصلی"><span>LaLa</span> Marnia</a>
        <nav class="site-nav" aria-label="ناوبری اصلی">
            <a href="/">فروشگاه</a>
            <a href="/cart.html" aria-current="page">سبد خرید</a>
        </nav>
    </header>

    <main class="page">
        <section class="intro">
            <span class="eyebrow">چند قدم تا سفارش</span>
            <h1>سبد خرید</h1>
            <p>محصولاتت را بررسی کن و اطلاعات تحویل را وارد کن.</p>
        </section>

        <div class="cart-layout">
            <div id="cart"></div>
            <!-- This form calls checkout() from /js/cart.js when submitted. -->
            <form
                id="checkout-form"
                class="panel"
                onsubmit="checkout(event)"
                hidden
            >
                <h2>اطلاعات سفارش</h2>
                <label for="customer-name">نام و نام خانوادگی</label>
                <input
                    type="text"
                    id="customer-name"
                    name="customer_name"
                    required
                >
                <label for="customer-phone">شماره تماس</label>
                <input
                    type="tel"
                    id="customer-phone"
                    name="customer_phone"
                    required
                >
                <label for="customer-address">آدرس تحویل</label>
                <textarea
                    id="customer-address"
                    name="customer_address"
                    required
                ></textarea>
                <button type="submit">ثبت سفارش</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <a class="brand" href="/">LaLa Marnia</a>
        <span>زیبایی، در لحظه‌های روزمره.</span>
    </footer>

    <script src="/js/cart.js"></script>
</body>
</html>
